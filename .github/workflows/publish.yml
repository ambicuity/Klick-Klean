name: Publish to Chrome Web Store

# Publishes the extension to the Chrome Web Store directly from GitHub.
#
# Triggers:
#   - Pushing a tag like v1.1.0
#   - Manually via the Actions tab (workflow_dispatch)
#
# Authentication uses a Google Cloud service account, not an OAuth refresh
# token. The service account must be registered as a publisher on the Chrome
# Web Store developer account that owns this listing.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CWS_EXTENSION_ID          - this extension's Web Store item id
#   CWS_SERVICE_ACCOUNT_JSON  - service-account key file contents
#
# The publisher id is a public identifier from the dashboard's Account page,
# so it lives in the workflow rather than in a secret.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Submit the uploaded package for review"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cws-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CWS_PUBLISHER_ID: 8b00f945-9ad2-4149-a831-8f017da3a783
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify (tests must pass before publishing)
        run: npm test

      - name: Guard - manifest version must match tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ] || [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::version mismatch: manifest=$MANIFEST_VERSION package=$PACKAGE_VERSION tag=$TAG_VERSION"
            exit 1
          fi
          echo "Version check OK: $MANIFEST_VERSION"

      - name: Build package
        run: bash scripts/build-zip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: klick-klean-package
          path: dist/klick-klean-*.zip

      - name: Upload and publish to Chrome Web Store
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_SKIP_PUBLISH: ${{ github.event.inputs.publish == 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${CWS_EXTENSION_ID:-}" ] || [ -z "${CWS_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::missing CWS_EXTENSION_ID or CWS_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi
          VERSION="$(node -p "require('./manifest.json').version")"
          node scripts/publish-chrome-webstore.mjs "dist/klick-klean-${VERSION}.zip"
